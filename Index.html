<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Mis Agentes IA</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script type="module">
    // Carga perezosa de WebLLM (modelos open-source en el navegador vía WebGPU)
    window.loadWebLLM = () => import('https://esm.run/@mlc-ai/web-llm');
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f5; }
    #root { max-width: 480px; margin: 0 auto; height: 100vh; height: 100dvh; display: flex; flex-direction: column; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ===== STORAGE =====
    const storage = {
      getItem: (key) => { try { return localStorage.getItem(key); } catch { return null; } },
      setItem: (key, value) => { try { localStorage.setItem(key, value); return true; } catch { return false; } },
      removeItem: (key) => { try { localStorage.removeItem(key); } catch {} },
    };
    const readJSON = (key, fallback) => { try { const v = storage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; } };

    // ===== PROVEEDORES (todos con modelos open-source) =====
    const PROVIDERS = {
      webllm:     { label:'🌐 En tu navegador (gratis, sin key)', needsKey:false, models:['Qwen2.5-1.5B-Instruct-q4f16_1-MLC','Llama-3.2-1B-Instruct-q4f16_1-MLC','Qwen2.5-3B-Instruct-q4f16_1-MLC'] },
      groq:       { label:'Groq — Llama 3.3 (key gratuita)', needsKey:true, baseUrl:'https://api.groq.com/openai/v1', models:['llama-3.3-70b-versatile','llama-3.1-8b-instant'], link:'console.groq.com/keys' },
      openrouter: { label:'OpenRouter — modelos abiertos', needsKey:true, baseUrl:'https://openrouter.ai/api/v1', models:['meta-llama/llama-3.3-70b-instruct:free','qwen/qwen-2.5-72b-instruct:free'], link:'openrouter.ai/keys' },
      deepseek:   { label:'DeepSeek (pesos abiertos)', needsKey:true, baseUrl:'https://api.deepseek.com/v1', models:['deepseek-chat'], link:'platform.deepseek.com' },
      custom:     { label:'Ollama / servidor compatible OpenAI', needsKey:false, baseUrl:'http://localhost:11434/v1', models:['llama3.2'] },
    };
    const DEFAULT_SETTINGS = { provider:'webllm', keys:{}, models:{}, customUrl:'http://localhost:11434/v1' };
    const getSettings = () => ({ ...DEFAULT_SETTINGS, ...readJSON('settings_v2', {}) });
    const activeConfig = (st) => {
      const p = PROVIDERS[st.provider];
      return { provider: st.provider, def: p, apiKey: st.keys[st.provider] || '', model: st.models[st.provider] || p.models[0], baseUrl: st.provider === 'custom' ? st.customUrl : p.baseUrl };
    };

    // ===== HERRAMIENTAS =====
    const TOOLS = {
      calculadora: {
        label:'🧮 Calculadora', desc:'Evalúa una expresión matemática. args: {"expression":"2*(3+4)"}',
        run: ({ expression }) => {
          const e = String(expression || '').replace(/\^/g, '**').replace(/,/g, '.');
          if (!/^[0-9+\-*/().%\s]+$/.test(e)) throw new Error('Expresión no válida');
          const r = Function(`"use strict"; return (${e})`)();
          if (typeof r !== 'number' || !isFinite(r)) throw new Error('Resultado no válido');
          return String(r);
        },
      },
      fecha_hora: {
        label:'🕒 Fecha y hora', desc:'Devuelve la fecha y hora actual del usuario. args: {}',
        run: () => new Date().toLocaleString('es', { dateStyle:'full', timeStyle:'long' }),
      },
      wikipedia: {
        label:'📚 Wikipedia', desc:'Busca un tema en Wikipedia y devuelve un resumen. args: {"query":"Albert Einstein"}',
        run: async ({ query }, signal) => {
          const q = encodeURIComponent(String(query || ''));
          const s = await (await fetch(`https://es.wikipedia.org/w/api.php?action=query&list=search&srsearch=${q}&srlimit=1&format=json&origin=*`, { signal })).json();
          const hit = s?.query?.search?.[0];
          if (!hit) return 'Sin resultados.';
          const ex = await (await fetch(`https://es.wikipedia.org/w/api.php?action=query&prop=extracts&exintro=1&explaintext=1&titles=${encodeURIComponent(hit.title)}&format=json&origin=*`, { signal })).json();
          const page = Object.values(ex.query.pages)[0];
          return `${hit.title}: ${(page.extract || '').slice(0, 1500)}`;
        },
      },
    };
    const toolsPrompt = (ids) => !ids?.length ? '' :
      `\n\nTienes herramientas. Para usar una, responde ÚNICAMENTE con esta línea, sin nada más:\n<tool>{"name":"NOMBRE","args":{...}}</tool>\nRecibirás el resultado y entonces responde al usuario con él. Si no necesitas herramientas, responde normalmente. Herramientas:\n` +
      ids.map(id => `- ${id}: ${TOOLS[id].desc}`).join('\n');
    const parseToolCall = (text) => {
      const m = text.match(/<tool>([\s\S]*?)<\/tool>/);
      if (!m) return null;
      try { const c = JSON.parse(m[1]); return TOOLS[c.name] ? { name: c.name, args: c.args || {} } : { name: c.name, args: {}, invalid: true }; } catch { return { name:'?', args:{}, invalid: true }; }
    };

    // ===== INTEROPERABILIDAD =====
    const buildSystem = (agent, withToolProtocol = true) =>
      `Eres un agente de IA llamado "${agent.name}". Instrucciones: ${agent.instructions}. Personalidad: ${agent.personality || 'Neutral'}. Responde siempre en el idioma del usuario.` + (withToolProtocol ? toolsPrompt(agent.tools) : '');
    const TOOL_PARAMS = {
      calculadora: { type:'object', properties:{ expression:{ type:'string', description:'Expresión matemática, ej. 2*(3+4)' } }, required:['expression'] },
      fecha_hora:  { type:'object', properties:{} },
      wikipedia:   { type:'object', properties:{ query:{ type:'string', description:'Tema a buscar' } }, required:['query'] },
    };
    const toolSchemas = (ids = []) => ids.filter(id => TOOLS[id]).map(id => ({ type:'function', function:{ name:id, description:TOOLS[id].desc.split(' args:')[0], parameters:TOOL_PARAMS[id] } }));
    // Formato portable (OpenAI-compatible): sirve para cualquier app/API que acepte system prompt + tools
    const exportAgent = (agent) => ({
      format:'agente-ia', version:1,
      name:agent.name, instructions:agent.instructions, personality:agent.personality || 'Neutral', tools:agent.tools || [],
      system_prompt: buildSystem(agent, false),
      openai: { messages:[{ role:'system', content: buildSystem(agent, false) }], tools: toolSchemas(agent.tools) },
    });
    // Acepta nuestro JSON, y también formatos ajenos: {name,instructions}, {system}, {system_prompt}, {openai:{messages}}, OpenAI Assistants...
    const parseImport = (text) => {
      const t = text.trim();
      let o = null;
      try { o = JSON.parse(t); } catch {}
      if (!o) { const m = t.match(/#import=([\w-]+)/); if (m) o = decodeShare(m[1]); }
      if (!o) { if (!t) throw new Error('Pega un JSON, un enlace o un prompt.'); o = { name:'Agente importado', instructions:t }; }
      const sys = o.instructions || o.system_prompt || o.system || o.prompt || o.openai?.messages?.find(m => m.role === 'system')?.content;
      if (!sys) throw new Error('No encontré instrucciones en el contenido.');
      const toolIds = (o.tools || []).map(x => typeof x === 'string' ? x : x?.function?.name || x?.name).filter(id => TOOLS[id]);
      return { name:String(o.name || 'Agente importado').slice(0, 60), instructions:String(sys), personality:String(o.personality || 'Neutral'), tools:[...new Set(toolIds)] };
    };
    const encodeShare = (agent) => btoa(unescape(encodeURIComponent(JSON.stringify({ name:agent.name, instructions:agent.instructions, personality:agent.personality, tools:agent.tools || [] })))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
    const decodeShare = (b) => { try { return JSON.parse(decodeURIComponent(escape(atob(b.replace(/-/g,'+').replace(/_/g,'/'))))); } catch { return null; } };
    const saveImported = (data) => {
      const agents = readJSON('agents', []);
      const a = { id: Date.now().toString() + Math.random().toString(36).slice(2, 6), ...data };
      storage.setItem('agents', JSON.stringify([...agents, a]));
      return a;
    };
    const copyText = async (t) => { try { await navigator.clipboard.writeText(t); return true; } catch { return false; } };
    const downloadFile = (name, text) => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type:'application/json' })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); };

    // ===== MOTOR LLM =====
    let webllmEngine = null, webllmModel = null, onWebllmProgress = () => {};
    async function getWebllm(model) {
      if (!navigator.gpu) throw new Error('Tu navegador no soporta WebGPU. Usa Chrome/Edge de escritorio o elige otro proveedor en Ajustes.');
      if (webllmEngine && webllmModel === model) return webllmEngine;
      const webllm = await window.loadWebLLM();
      webllmEngine = await webllm.CreateMLCEngine(model, { initProgressCallback: (p) => onWebllmProgress(p.text || '') });
      webllmModel = model;
      return webllmEngine;
    }
    const httpError = (status, msg) => new Error(status === 401 ? 'API key inválida (401). Revísala en Ajustes.' : status === 402 ? 'Saldo insuficiente (402).' : status === 429 ? 'Demasiadas peticiones (429). Espera un momento.' : msg || `Error HTTP ${status}`);

    async function streamCompletion({ cfg, messages, onToken, signal }) {
      let full = '';
      if (cfg.provider === 'webllm') {
        const engine = await getWebllm(cfg.model);
        const onAbort = () => engine.interruptGenerate();
        signal.addEventListener('abort', onAbort);
        try {
          const chunks = await engine.chat.completions.create({ messages, stream:true, max_tokens:1000 });
          for await (const c of chunks) { const t = c.choices[0]?.delta?.content || ''; full += t; onToken(full); }
        } finally { signal.removeEventListener('abort', onAbort); }
        return full;
      }
      const headers = { 'Content-Type':'application/json' };
      if (cfg.apiKey) headers.Authorization = `Bearer ${cfg.apiKey}`;
      const resp = await fetch(`${cfg.baseUrl.replace(/\/+$/, '')}/chat/completions`, { method:'POST', signal, headers, body: JSON.stringify({ model: cfg.model, messages, stream:true, max_tokens:1000 }) });
      if (!resp.ok) { const d = await resp.json().catch(() => ({})); throw httpError(resp.status, d?.error?.message); }
      const reader = resp.body.getReader(), dec = new TextDecoder();
      let buf = '';
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream:true });
        const lines = buf.split('\n'); buf = lines.pop();
        for (const line of lines) {
          const l = line.trim();
          if (!l.startsWith('data:')) continue;
          const d = l.slice(5).trim();
          if (d === '[DONE]') continue;
          try { const t = JSON.parse(d).choices?.[0]?.delta?.content || ''; if (t) { full += t; onToken(full); } } catch {}
        }
      }
      if (!full) throw new Error('Respuesta vacía de la IA.');
      return full;
    }

    // ===== APP =====
    function App() {
      const [screen, setScreen] = useState('Home');
      const [params, setParams] = useState({});
      const navigate = (to, p = {}) => { setScreen(to); setParams(p); };
      const goBack = () => setScreen('Home');
      const titles = { Home: 'Mis Agentes', CreateAgent: params.agent ? 'Editar Agente' : 'Nuevo Agente', Chat: params.agent?.name || 'Chat', Settings: 'Ajustes' };

      return (
        <div style={{ display:'flex', flexDirection:'column', height:'100%' }}>
          <div style={{ backgroundColor:'#f2f2f7', borderBottom:'1px solid #ddd', padding:'14px 16px', display:'flex', alignItems:'center', gap:10, minHeight:50 }}>
            {screen !== 'Home' && (
              <button onClick={goBack} style={{ background:'none', border:'none', fontSize:28, color:'#007AFF', cursor:'pointer', padding:'0 8px 0 0' }}>‹</button>
            )}
            <span style={{ fontSize:17, fontWeight:600, flex:1 }}>{titles[screen]}</span>
            {screen === 'Home' && (
              <button onClick={() => navigate('Settings')} title="Ajustes" style={{ background:'none', border:'none', fontSize:22, cursor:'pointer' }}>⚙️</button>
            )}
          </div>
          {screen === 'Home'        && <HomeScreen navigate={navigate} />}
          {screen === 'CreateAgent' && <CreateAgentScreen goBack={goBack} agent={params.agent} />}
          {screen === 'Settings'    && <SettingsScreen />}
          {screen === 'Chat'        && <ChatScreen key={params.agent.id} agent={params.agent} navigate={navigate} />}
        </div>
      );
    }

    // ===== MODALES =====
    const btn = (bg) => ({ backgroundColor:bg, color:'white', border:'none', borderRadius:8, padding:'10px 12px', fontSize:14, cursor:'pointer', fontWeight:600 });
    function Modal({ title, onClose, children }) {
      return (
        <div onClick={onClose} style={{ position:'fixed', inset:0, background:'rgba(0,0,0,0.45)', display:'flex', alignItems:'flex-end', justifyContent:'center', zIndex:10 }}>
          <div onClick={e => e.stopPropagation()} style={{ background:'#fff', width:'100%', maxWidth:480, maxHeight:'85vh', overflowY:'auto', borderRadius:'16px 16px 0 0', padding:20 }}>
            <div style={{ display:'flex', justifyContent:'space-between', marginBottom:12 }}>
              <b style={{ fontSize:17 }}>{title}</b>
              <button onClick={onClose} style={{ background:'none', border:'none', fontSize:20, cursor:'pointer' }}>✕</button>
            </div>
            {children}
          </div>
        </div>
      );
    }
    function ExportModal({ agent, onClose }) {
      const [msg, setMsg] = useState('');
      const json = JSON.stringify(exportAgent(agent), null, 2);
      const prompt = buildSystem(agent, false);
      const link = `${location.origin}${location.pathname}#import=${encodeShare(agent)}`;
      const curl = `curl https://api.openai.com/v1/chat/completions \\\n  -H "Authorization: Bearer $API_KEY" -H "Content-Type: application/json" \\\n  -d '${JSON.stringify({ model:'MODELO', messages:[...exportAgent(agent).openai.messages, { role:'user', content:'Hola' }], tools: toolSchemas(agent.tools) })}'`;
      const copy = async (t, what) => setMsg(await copyText(t) ? `✅ ${what} copiado` : 'No se pudo copiar');
      const q = encodeURIComponent(prompt + '\n\nPresenta tu rol y pregúntame en qué puedes ayudarme.');
      const row = { display:'flex', flexWrap:'wrap', gap:8, marginBottom:12 };
      return (
        <Modal title={`Compartir "${agent.name}"`} onClose={onClose}>
          <p style={{ fontSize:13, color:'#666', marginBottom:12 }}>Usa este agente en cualquier app de IA.</p>
          <b style={{ fontSize:14 }}>Pegar en ChatGPT, Claude, Gemini, etc.</b>
          <div style={row}>
            <button style={btn('#007AFF')} onClick={() => copy(prompt, 'Prompt')}>Copiar prompt</button>
            <a style={{ ...btn('#10A37F'), textDecoration:'none' }} href={`https://chatgpt.com/?q=${q}`} target="_blank" rel="noopener noreferrer">Abrir en ChatGPT</a>
            <a style={{ ...btn('#D97757'), textDecoration:'none' }} href={`https://claude.ai/new?q=${q}`} target="_blank" rel="noopener noreferrer">Abrir en Claude</a>
          </div>
          <b style={{ fontSize:14 }}>Para desarrolladores / otras apps</b>
          <div style={row}>
            <button style={btn('#5856D6')} onClick={() => downloadFile(`${agent.name.replace(/\W+/g, '_')}.agent.json`, json)}>Descargar JSON</button>
            <button style={btn('#5856D6')} onClick={() => copy(json, 'JSON')}>Copiar JSON</button>
            <button style={btn('#5856D6')} onClick={() => copy(curl, 'cURL')}>Copiar cURL (OpenAI API)</button>
          </div>
          <b style={{ fontSize:14 }}>Compartir con otra persona</b>
          <div style={row}><button style={btn('#34C759')} onClick={() => copy(link, 'Enlace')}>Copiar enlace</button></div>
          {msg && <p style={{ fontSize:13, color:'#34C759' }}>{msg}</p>}
        </Modal>
      );
    }
    function ImportModal({ initial, onClose, onDone }) {
      const [text, setText] = useState(initial || '');
      const [err, setErr] = useState('');
      const go = () => { try { saveImported(parseImport(text)); onDone(); } catch (e) { setErr(e.message); } };
      const onFile = async (e) => { const f = e.target.files[0]; if (f) setText(await f.text()); };
      return (
        <Modal title="Importar agente" onClose={onClose}>
          <p style={{ fontSize:13, color:'#666', marginBottom:8 }}>Pega un JSON (de esta app, OpenAI u otra), un enlace compartido o simplemente un prompt de sistema.</p>
          <textarea value={text} onChange={e => { setText(e.target.value); setErr(''); }} style={{ width:'100%', height:120, border:'1px solid #ccc', borderRadius:8, padding:10, fontSize:14, fontFamily:'inherit' }} />
          <input type="file" accept=".json,.txt,.md" onChange={onFile} style={{ margin:'8px 0' }} />
          {err && <p style={{ color:'#B3261E', fontSize:13, marginBottom:8 }}>{err}</p>}
          <button style={{ ...btn('#34C759'), width:'100%', padding:14, fontSize:16 }} onClick={go}>Importar</button>
        </Modal>
      );
    }

    // ===== HOME =====
    function HomeScreen({ navigate }) {
      const [agents, setAgents] = useState([]);
      const [exporting, setExporting] = useState(null);
      const [importing, setImporting] = useState(() => /#import=/.test(location.hash) ? decodeURIComponent(location.hash.slice(1)) : false);

      useEffect(() => {
        setAgents(readJSON('agents', []));
      }, []);

      const deleteAgent = (id) => {
        if (!window.confirm('¿Eliminar este agente?')) return;
        const updated = agents.filter(a => a.id !== id);
        storage.setItem('agents', JSON.stringify(updated));
        storage.removeItem(`conv_${id}`);
        setAgents(updated);
      };

      return (
        <div style={{ flex:1, padding:20, overflowY:'auto', backgroundColor:'#f5f5f5' }}>
          <button onClick={() => navigate('CreateAgent')}
            style={{ backgroundColor:'#007AFF', color:'white', fontSize:18, fontWeight:'bold', padding:15, borderRadius:10, border:'none', width:'100%', cursor:'pointer', marginBottom:20 }}>
            + Crear Nuevo Agente
          </button>
          <button onClick={() => setImporting(true)}
            style={{ backgroundColor:'#fff', color:'#007AFF', fontSize:15, fontWeight:600, padding:10, borderRadius:10, border:'1px solid #007AFF', width:'100%', cursor:'pointer', marginBottom:20, marginTop:-8 }}>
            ⬇️ Importar agente
          </button>
          {exporting && <ExportModal agent={exporting} onClose={() => setExporting(null)} />}
          {importing && <ImportModal initial={typeof importing === 'string' ? importing : ''} onClose={() => { setImporting(false); if (location.hash) history.replaceState(null, '', location.pathname); }}
            onDone={() => { setImporting(false); history.replaceState(null, '', location.pathname); setAgents(readJSON('agents', [])); }} />}

          {agents.length === 0 ? (
            <div style={{ textAlign:'center', marginTop:100 }}>
              <p style={{ fontSize:18, color:'#888' }}>No tienes agentes creados.</p>
              <p style={{ fontSize:14, color:'#aaa', marginTop:10 }}>Toca "Crear Nuevo Agente" para empezar.</p>
            </div>
          ) : agents.map(item => (
            <div key={item.id} style={{ display:'flex', backgroundColor:'#fff', borderRadius:10, padding:15, marginBottom:10, alignItems:'center', boxShadow:'0 1px 4px rgba(0,0,0,0.08)' }}>
              <div style={{ flex:1, cursor:'pointer' }} onClick={() => navigate('Chat', { agent: item })}>
                <p style={{ fontSize:18, fontWeight:'bold', marginBottom:4 }}>{item.name}</p>
                <p style={{ fontSize:14, color:'#666', marginBottom:4 }}>{item.instructions.slice(0,80)}...</p>
                <p style={{ fontSize:12, color:'#888' }}>🧠 {item.personality || 'Neutral'}{item.tools?.length ? ` · 🔧 ${item.tools.length}` : ''}</p>
              </div>
              <button onClick={() => setExporting(item)} title="Compartir / exportar"
                style={{ backgroundColor:'#007AFF', color:'white', border:'none', borderRadius:'50%', width:30, height:30, cursor:'pointer', fontSize:14, marginRight:8 }}>⇪</button>
              <button onClick={() => navigate('CreateAgent', { agent: item })} title="Editar"
                style={{ backgroundColor:'#8E8E93', color:'white', border:'none', borderRadius:'50%', width:30, height:30, cursor:'pointer', fontSize:14, marginRight:8 }}>✎</button>
              <button onClick={() => deleteAgent(item.id)}
                style={{ backgroundColor:'#FF3B30', color:'white', border:'none', borderRadius:'50%', width:30, height:30, cursor:'pointer', fontWeight:'bold', fontSize:14 }}>✕</button>
            </div>
          ))}
        </div>
      );
    }

    // ===== CREATE AGENT =====
    function CreateAgentScreen({ goBack, agent }) {
      const [name, setName] = useState(agent?.name || '');
      const [instructions, setInstructions] = useState(agent?.instructions || '');
      const [personality, setPersonality] = useState(agent?.personality && agent.personality !== 'Neutral' ? agent.personality : '');
      const [tools, setTools] = useState(agent?.tools || []);
      const toggleTool = (id) => setTools(t => t.includes(id) ? t.filter(x => x !== id) : [...t, id]);

      const saveAgent = () => {
        if (!name.trim() || !instructions.trim()) { alert('Nombre e instrucciones son obligatorios'); return; }
        const data = { name: name.trim(), instructions: instructions.trim(), personality: personality.trim() || 'Neutral', tools };
        const agents = readJSON('agents', []);
        const next = agent
          ? agents.map(a => a.id === agent.id ? { ...a, ...data } : a)
          : [...agents, { id: Date.now().toString(), ...data }];
        if (!storage.setItem('agents', JSON.stringify(next))) { alert('No se pudo guardar (almacenamiento no disponible)'); return; }
        goBack();
      };

      const inputStyle = { width:'100%', border:'1px solid #ccc', borderRadius:8, padding:10, fontSize:16, fontFamily:'inherit', marginBottom:10 };

      return (
        <div style={{ flex:1, padding:20, backgroundColor:'#fff', overflowY:'auto' }}>
          <label style={{ fontSize:16, fontWeight:'bold', display:'block', marginTop:15, marginBottom:5 }}>Nombre del agente *</label>
          <input style={inputStyle} value={name} onChange={e => setName(e.target.value)} placeholder="Ej: Asistente Legal" />

          <label style={{ fontSize:16, fontWeight:'bold', display:'block', marginTop:15, marginBottom:5 }}>Instrucciones *</label>
          <textarea style={{ ...inputStyle, height:100, resize:'vertical' }} value={instructions} onChange={e => setInstructions(e.target.value)} placeholder="Eres un abogado experto en derecho laboral..." />

          <label style={{ fontSize:16, fontWeight:'bold', display:'block', marginTop:15, marginBottom:5 }}>Personalidad (opcional)</label>
          <input style={inputStyle} value={personality} onChange={e => setPersonality(e.target.value)} placeholder="Ej: Formal, Amigable, Irónico" />

          <label style={{ fontSize:16, fontWeight:'bold', display:'block', marginTop:15, marginBottom:5 }}>Herramientas</label>
          {Object.entries(TOOLS).map(([id, t]) => (
            <label key={id} style={{ display:'flex', alignItems:'center', gap:8, padding:'6px 0', fontSize:15 }}>
              <input type="checkbox" checked={tools.includes(id)} onChange={() => toggleTool(id)} /> {t.label}
            </label>
          ))}

          <button onClick={saveAgent}
            style={{ backgroundColor:'#34C759', color:'white', fontSize:18, fontWeight:'bold', padding:15, borderRadius:10, border:'none', width:'100%', cursor:'pointer', marginTop:20 }}>
            {agent ? 'Guardar Cambios' : 'Guardar Agente'}
          </button>
        </div>
      );
    }

    // ===== SETTINGS =====
    function SettingsScreen() {
      const [st, setSt] = useState(getSettings());
      const [saved, setSaved] = useState(false);
      const cfg = activeConfig(st);
      const upd = (patch) => { setSaved(false); setSt({ ...st, ...patch }); };
      const save = () => { if (!storage.setItem('settings_v2', JSON.stringify(st))) alert('No se pudo guardar'); else setSaved(true); };
      const inputStyle = { width:'100%', border:'1px solid #ccc', borderRadius:8, padding:10, fontSize:16, fontFamily:'inherit', marginBottom:10 };
      const label = { fontSize:16, fontWeight:'bold', display:'block', marginTop:15, marginBottom:5 };
      return (
        <div style={{ flex:1, padding:20, backgroundColor:'#fff', overflowY:'auto' }}>
          <label style={label}>Modelo de IA</label>
          <select style={inputStyle} value={st.provider} onChange={e => upd({ provider: e.target.value })}>
            {Object.entries(PROVIDERS).map(([id, p]) => <option key={id} value={id}>{p.label}</option>)}
          </select>
          {st.provider === 'webllm' && <p style={{ fontSize:12, color:'#888', marginBottom:10 }}>Se descarga una sola vez (~1 GB) y corre 100% en tu dispositivo: privado y gratis. Requiere WebGPU (Chrome/Edge de escritorio).</p>}

          {st.provider === 'custom' && (<>
            <label style={label}>URL del servidor</label>
            <input style={inputStyle} value={st.customUrl} onChange={e => upd({ customUrl: e.target.value })} />
          </>)}

          <label style={label}>Modelo</label>
          <input style={inputStyle} list="model-list" value={cfg.model} onChange={e => upd({ models: { ...st.models, [st.provider]: e.target.value } })} />
          <datalist id="model-list">{cfg.def.models.map(m => <option key={m} value={m} />)}</datalist>

          {cfg.def.needsKey && (<>
            <label style={label}>API Key</label>
            <input style={inputStyle} type="password" autoComplete="off" value={cfg.apiKey} placeholder="Pega tu key"
              onChange={e => upd({ keys: { ...st.keys, [st.provider]: e.target.value.trim() } })} />
            <p style={{ fontSize:12, color:'#888', marginBottom:10 }}>Consíguela en {cfg.def.link}. Se guarda solo en este navegador y se envía únicamente a ese proveedor.</p>
          </>)}

          <button onClick={save} style={{ backgroundColor:'#34C759', color:'white', fontSize:18, fontWeight:'bold', padding:15, borderRadius:10, border:'none', width:'100%', cursor:'pointer', marginTop:20 }}>Guardar</button>
          {saved && <p style={{ color:'#34C759', textAlign:'center', marginTop:10 }}>✅ Guardado</p>}
        </div>
      );
    }

    // ===== CHAT =====
    const MAX_HISTORY = 30, MAX_TOOL_STEPS = 4;
    const stripTool = (t) => t.replace(/<tool>[\s\S]*?<\/tool>/g, '').trim();
    function ChatScreen({ agent, navigate }) {
      const [messages, setMessages] = useState(() => readJSON(`conv_${agent.id}`, []));
      const [input, setInput] = useState('');
      const [loading, setLoading] = useState(false);
      const [streaming, setStreaming] = useState('');
      const [status, setStatus] = useState('');
      const [error, setError] = useState('');
      const bottomRef = useRef(null);
      const abortRef = useRef(null);
      const cfg = activeConfig(getSettings());
      const missingKey = cfg.def.needsKey && !cfg.apiKey;

      useEffect(() => { bottomRef.current?.scrollIntoView({ behavior:'smooth' }); }, [messages, streaming, loading, error, status]);
      useEffect(() => () => abortRef.current?.abort(), []);

      const persist = (list) => { setMessages(list); storage.setItem(`conv_${agent.id}`, JSON.stringify(list.slice(-200))); };

      const clearChat = () => {
        if (!window.confirm('¿Borrar toda la conversación?')) return;
        abortRef.current?.abort();
        storage.removeItem(`conv_${agent.id}`);
        setMessages([]); setError(''); setLoading(false); setStreaming(''); setStatus('');
      };
      const stop = () => abortRef.current?.abort();

      const toApi = (list) => list.slice(-MAX_HISTORY).map(m => m.role === 'tool'
        ? { role:'user', content:`[Resultado de ${m.tool}]: ${m.content}` } : { role:m.role, content:m.content });

      const run = async (startList) => {
        const controller = new AbortController();
        abortRef.current = controller;
        setError(''); setLoading(true);
        onWebllmProgress = (t) => setStatus(t);
        let list = startList;
        const system = buildSystem(agent);
        try {
          for (let step = 0; step <= MAX_TOOL_STEPS; step++) {
            setStatus(cfg.provider === 'webllm' && !webllmEngine ? 'Cargando modelo…' : '');
            const text = await streamCompletion({ cfg, signal: controller.signal, onToken: (t) => { setStatus(''); setStreaming(stripTool(t)); }, messages: [{ role:'system', content:system }, ...toApi(list)] });
            setStreaming('');
            list = [...list, { role:'assistant', content:text }];
            persist(list);
            const call = agent.tools?.length && step < MAX_TOOL_STEPS ? parseToolCall(text) : null;
            if (!call) break;
            setStatus(`🔧 Usando ${call.name}…`);
            let result;
            try {
              if (call.invalid) throw new Error('Herramienta no disponible');
              result = String(await TOOLS[call.name].run(call.args, controller.signal));
            } catch (e) { if (e.name === 'AbortError') throw e; result = `Error: ${e.message}`; }
            list = [...list, { role:'tool', tool:call.name, content:result }];
            persist(list);
          }
        } catch (e) {
          if (e.name !== 'AbortError') setError(e instanceof TypeError ? 'No se pudo conectar. Revisa tu conexión o la URL del servidor (¿CORS?).' : e.message);
        } finally {
          setStreaming(''); setStatus(''); setLoading(false);
        }
      };

      const sendMessage = () => {
        const text = input.trim();
        if (!text || loading) return;
        if (missingKey) { setError('Falta la API key. Configúrala en Ajustes.'); return; }
        const list = [...messages, { role:'user', content:text }];
        persist(list); setInput('');
        run(list);
      };
      const retry = () => { if (!loading && messages.length) run(messages); };
      const last = messages[messages.length - 1];
      const canRetry = last && last.role !== 'assistant';

      const bubble = (role, content, key) => (
        <div key={key} style={{ display:'flex', justifyContent: role === 'user' ? 'flex-end' : 'flex-start', marginBottom:8 }}>
          <div style={{ backgroundColor: role === 'user' ? '#007AFF' : '#e5e5ea', borderRadius:18, padding:'10px 14px', maxWidth:'80%' }}>
            <p style={{ fontSize:15, color: role === 'user' ? '#fff' : '#000', margin:0, whiteSpace:'pre-wrap', wordBreak:'break-word' }}>{content}</p>
          </div>
        </div>
      );

      return (
        <div style={{ display:'flex', flexDirection:'column', flex:1, overflow:'hidden' }}>
          <div style={{ backgroundColor:'#fff', padding:'10px 16px', borderBottom:'1px solid #eee', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
            <span style={{ fontSize:12, color:'#888' }}>🧠 {agent.personality || 'Neutral'} · {cfg.model.split('/').pop()}</span>
            <button onClick={clearChat} disabled={!messages.length} style={{ background:'none', border:'none', color:'#FF3B30', cursor:'pointer', opacity: messages.length ? 1 : 0.4 }}>🗑 Borrar chat</button>
          </div>

          <div style={{ flex:1, overflowY:'auto', padding:10 }}>
            {missingKey && (
              <div style={{ background:'#FFF3CD', borderRadius:10, padding:12, marginBottom:10, fontSize:14 }}>
                ⚠️ Este modelo necesita una API key. <button onClick={() => navigate('Settings')} style={{ background:'none', border:'none', color:'#007AFF', cursor:'pointer', textDecoration:'underline', fontSize:14 }}>Ir a Ajustes</button>
              </div>
            )}
            {messages.length === 0 && <p style={{ textAlign:'center', color:'#aaa', marginTop:40 }}>Envía un mensaje para empezar.</p>}
            {messages.map((m, i) => {
              if (m.role === 'tool') return <p key={i} style={{ textAlign:'center', fontSize:12, color:'#888', margin:'4px 0 8px' }}>🔧 {m.tool}: {m.content.slice(0, 120)}{m.content.length > 120 ? '…' : ''}</p>;
              const text = m.role === 'assistant' ? stripTool(m.content) : m.content;
              return text ? bubble(m.role, text, i) : null;
            })}
            {streaming && bubble('assistant', streaming, 's')}
            {loading && !streaming && <p style={{ textAlign:'center', fontSize:13, color:'#888' }}>{status || '...'}</p>}
            {error && (
              <div style={{ background:'#FFE5E3', color:'#B3261E', borderRadius:10, padding:12, marginBottom:8, fontSize:14 }}>
                {error}
                {canRetry && !loading && <button onClick={retry} style={{ marginLeft:8, background:'none', border:'none', color:'#007AFF', cursor:'pointer', textDecoration:'underline', fontSize:14 }}>Reintentar</button>}
              </div>
            )}
            <div ref={bottomRef} />
          </div>

          <div style={{ display:'flex', padding:10, backgroundColor:'#fff', borderTop:'1px solid #ddd', gap:10 }}>
            <input
              style={{ flex:1, minWidth:0, border:'1px solid #ccc', borderRadius:20, padding:'10px 14px', fontSize:16, outline:'none' }}
              value={input} onChange={e => setInput(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && !e.nativeEvent.isComposing && sendMessage()}
              placeholder="Escribe tu mensaje..." disabled={loading} />
            {loading
              ? <button onClick={stop} style={{ backgroundColor:'#FF3B30', color:'white', border:'none', borderRadius:20, padding:'10px 18px', fontWeight:'bold', cursor:'pointer' }}>■</button>
              : <button onClick={sendMessage} style={{ backgroundColor:'#007AFF', color:'white', border:'none', borderRadius:20, padding:'10px 18px', fontWeight:'bold', cursor:'pointer' }}>Enviar</button>}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
